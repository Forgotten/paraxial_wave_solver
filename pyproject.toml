[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paraxial-wave-solver"
version = "0.1.0"
description = "A JAX-based solver for the paraxial wave equation in 3D."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
  {name = "Leonardo Zepeda-Nunez"}, 
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["paraxial_wave_solver/tests"]
markers = [
    "slow: memory or timing measurements; environment sensitive",
]
pythonpath = ["."]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]  # `l` is the standard name for the LG azimuthal index.

[tool.ruff.format]
indent-style = "space"
